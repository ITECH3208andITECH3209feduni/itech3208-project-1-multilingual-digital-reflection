<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryBond - Clinician Login</title>
  <link rel="stylesheet" href="clinician.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="clinician-auth-page">
  <div class="rainbow-top"></div>
  <main class="clinician-auth-shell">
    <section class="clinician-auth-card">
      <div class="clinician-brand">
        <div class="clinician-logo">🦊</div>
        <div><h1>StoryBond</h1><p>Clinician Access</p></div>
      </div>

      <div class="clinician-auth-heading">
        <span class="eyebrow">READ-ONLY PORTAL</span>
        <h2>Clinician sign in</h2>
        <p>Sign in to view child information that a parent has explicitly shared with you.</p>
      </div>

      <form id="clinicianLoginForm" class="clinician-form">
        <label for="clinicianEmail">Email</label>
        <input type="email" id="clinicianEmail" autocomplete="email" placeholder="clinician@example.com" required>

        <label for="clinicianPassword">Password</label>
        <input type="password" id="clinicianPassword" autocomplete="current-password" placeholder="Enter your password" required>

        <label class="remember-row">
          <input type="checkbox" id="clinicianRememberMe">
          <span>Remember me on this device</span>
        </label>

        <button type="submit" class="primary-clinician-btn" id="clinicianLoginButton">Sign in</button>
        <p id="clinicianLoginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <div class="clinician-security-note">🔒 Access is controlled by the parent and may be revoked at any time.</div>
      <a href="login.html" class="back-to-parent-login">← Parent login</a>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="clinician-login.js"></script>
</body>
</html>
