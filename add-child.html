<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryBond - Add Child</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Rainbow Magic Bar -->
    <div class="rainbow-top"></div>
    
    <div class="app-wrapper">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <!-- Brand -->
            <div class="brand">
                <div class="logo">🦊</div>
                <h1 class="brand-name">StoryBond</h1>
                <p class="brand-tagline">The Family Digital Journal</p>
            </div>

            <!-- Navigation -->
            <nav class="nav">
                <p class="nav-heading" data-i18n="nav_navigation">NAVIGATION</p>
                <a href="index.html" class="nav-link">
                    <span class="nav-emoji">🏠</span>
                    <span data-i18n="nav_home">Home</span>
                </a>
                <a href="new-entry.html" class="nav-link">
                    <span class="nav-emoji">📖</span>
                    <span data-i18n="nav_journal">Journal</span>
                </a>
                <a href="clinician-access.html" class="nav-link">
                    <span class="nav-emoji">🩺</span>
                    <span>Clinician Access</span>
                </a>
                <a href="weekly.html" class="nav-link">
                    <span class="nav-emoji">📊</span>
                    <span data-i18n="nav_weekly">Weekly Recap</span>
                </a>
            </nav>

            <!-- Children -->
            <div class="children">
                <p class="nav-heading" data-i18n="nav_children">CHILDREN</p>
                <div class="no-children" data-i18n="no_children">No children yet</div>
                <button class="add-child-btn active" onclick="window.location.href='add-child.html'">
                    <span class="plus">+</span>
                    <span data-i18n="add_child">Add child</span>
                </button>
            </div>

            <!-- User Profile -->
            <div class="user-card-wrapper">
                <div class="user-card" id="userCardTrigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
                    <div class="user-avatar">PA</div>
                    <div class="user-details">
                        <p class="user-name" data-i18n="user_name">Parent Account</p>
                        <p class="user-role" data-i18n="user_role">Parent</p>
                    </div>
                    <span class="user-card__chevron" aria-hidden="true">▾</span>
                </div>
                <div class="account-menu" id="accountMenu">
                    <button type="button" class="account-menu__item" id="switchAccountBtn">
                        <span class="account-menu__icon">🔄</span>
                        <span data-i18n="switch_account">Switch account</span>
                    </button>
                    <button type="button" class="account-menu__item account-menu__item--danger" id="logoutBtn">
                        <span class="account-menu__icon">🚪</span>
                        <span data-i18n="log_out">Log out</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div>
                    <h1 class="greeting" data-i18n="add_child_heading">Add child</h1>
                    <p class="date">Saturday, May 9, 2026</p>
                </div>
                <div class="lang-switcher">
                    <button class="lang-btn active">EN</button>
                    <button class="lang-btn">TR</button>
                </div>
                <a href="index.html" class="back-link">
                    <span>←</span> <span data-i18n="back_link">Back</span>
                </a>
            </header>

            <!-- Add Child Form Card -->
            <div class="add-child-container">
                <div class="add-child-card">
                    <div class="card-header">
                        <div class="card-icon">👶</div>
                        <div>
                            <h2 class="card-title" data-i18n="add_child_card_title">New child</h2>
                            <p class="card-subtitle" data-i18n="add_child_card_subtitle">Add your first child to get started</p>
                        </div>
                    </div>

                    <form class="child-form" id="childForm">
                        <!-- Child's Name -->
                        <div class="form-group">
                            <label for="childName" data-i18n="child_name_label">Child's name</label>
                            <input
                                type="text"
                                id="childName"
                                placeholder="e.g. Emma"
                                data-i18n-placeholder="child_name_placeholder"
                                class="form-input"
                            />
                            <span class="error-message" id="childNameError"></span>
                        </div>

                        <!-- Birthday -->
                        <div class="form-group">
                            <label for="birthday" data-i18n="birthday_label">Birthday</label>
                            <div class="date-input-wrapper">
                                <input
                                    type="text"
                                    id="birthday"
                                    placeholder="dd/mm/yyyy"
                                    class="form-input"
                                    maxlength="10"
                                />
                                <span class="calendar-icon">📅</span>
                            </div>
                            <span class="error-message" id="birthdayError"></span>
                        </div>

                        <!-- Color Selection -->
                        <div class="form-group">
                            <label data-i18n="color_label">Color</label>
                            <div class="color-picker">
                                <input type="radio" name="color" value="yellow" id="color-yellow" class="color-radio">
                                <label for="color-yellow" class="color-option yellow-color">
                                    <span class="color-check">✓</span>
                                </label>

                                <input type="radio" name="color" value="pink" id="color-pink" class="color-radio">
                                <label for="color-pink" class="color-option pink-color">
                                    <span class="color-check">✓</span>
                                </label>

                                <input type="radio" name="color" value="blue" id="color-blue" class="color-radio" checked>
                                <label for="color-blue" class="color-option blue-color">
                                    <span class="color-check">✓</span>
                                </label>

                                <input type="radio" name="color" value="green" id="color-green" class="color-radio">
                                <label for="color-green" class="color-option green-color">
                                    <span class="color-check">✓</span>
                                </label>

                                <input type="radio" name="color" value="purple" id="color-purple" class="color-radio">
                                <label for="color-purple" class="color-option purple-color">
                                    <span class="color-check">✓</span>
                                </label>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="form-actions">
                            <button type="button" class="cancel-btn" onclick="window.location.href='index.html'" data-i18n="cancel_btn">
                                Cancel
                            </button>
                            <button type="submit" class="submit-btn">
                                <span data-i18n="add_child">Add child</span>
                                <span class="btn-icon">+</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Empty State Message -->
                <div class="empty-state-message">
                    <span class="sparkle-icon">✨</span>
                    <span data-i18n="add_child_empty_state">Add a child to start capturing memories</span>
                </div>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="add-child-script.js"></script>
    <script src="logout.js"></script>
    <script src="session.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
