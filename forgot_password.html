<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >

    <title>Forgot Password - StoryBond</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body class="auth-page">

    <!-- Floating decorations -->

    <span class="auth-decoration">🌟</span>
    <span class="auth-decoration">🌈</span>
    <span class="auth-decoration">🎈</span>
    <span class="auth-decoration">🦄</span>

    <main class="auth-card">

        <!-- Language Switcher -->
        <div class="lang-switcher-auth">
            <button class="lang-btn active">EN</button>
            <button class="lang-btn">TR</button>
        </div>

        <!-- Header -->
        <div class="auth-header">

            <div
                class="auth-mascot"
                aria-hidden="true"
                >
                🦊
            </div>

            <div class="auth-brand">
                StoryBond
            </div>

            <h1 class="auth-title" data-i18n="forgot_title">
                Forgot your password?
            </h1>

            <p class="auth-subtitle" data-i18n="forgot_subtitle">
                Enter your email address and we'll send you a link
                to create a new password 🔐
            </p>

        </div>

        <!-- Forgot password form -->
        <form
            class="auth-form"
            id="forgotPasswordForm"
            >

            <!-- Email -->
            <div class="auth-field">

                <label
                    class="auth-label"
                    for="email"
                    data-i18n="email_address_label"
                    >
                    Email address
                </label>

                <div class="auth-input-wrapper">

                    <!-- Email icon -->
                    <svg
                        class="auth-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        >
                        <path
                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                            />

                        <polyline
                            points="22,6 12,13 2,6"
                            />
                    </svg>

                    <input
                        class="auth-input"
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="Enter your email address"
                        >

                </div>

            </div>

            <!-- Status / error / success message -->
            <p
                class="auth-message"
                id="message"
                role="alert"
                aria-live="polite"
            ></p>

            <!-- Submit -->
            <button
                class="auth-button"
                type="submit"
                data-i18n="forgot_btn"
                >
                ✉️ Send Reset Link
            </button>

        </form>

        <div class="auth-stars">
            ⭐ ⭐ ⭐
        </div>

        <!-- Footer -->
        <div class="auth-footer">

            <span data-i18n="remembered_password">Remembered your password?</span>

            <a href="login.html" data-i18n="back_to_login">
                Back to login
            </a>

        </div>

    </main>

    <script src="config.js"></script>
    <script src="forgot_password.js"></script>
    <script src="i18n.js"></script>

</body>

</html>
