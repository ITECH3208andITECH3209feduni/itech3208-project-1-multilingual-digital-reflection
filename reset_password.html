<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >

    <title>Reset Password - StoryBond</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="password-toggle.css">
</head>

<body class="auth-page">

    <!-- Floating decorations -->
    <span class="auth-decoration">🌟</span>
    <span class="auth-decoration">🌈</span>
    <span class="auth-decoration">🎈</span>
    <span class="auth-decoration">🦄</span>


    <main class="auth-card">

        <!-- Language Switcher -->
        <div class="lang-switcher-auth">
            <button class="lang-btn active">EN</button>
            <button class="lang-btn">TR</button>
        </div>

        <!-- Header -->
        <div class="auth-header">

            <div
                class="auth-mascot"
                aria-hidden="true"
                >
                🦊
            </div>

            <div class="auth-brand">
                StoryBond
            </div>

            <h1 class="auth-title" data-i18n="reset_title">
                Reset your password
            </h1>

            <p class="auth-subtitle" data-i18n="reset_subtitle">
                Choose a new password for your StoryBond account 🔐
            </p>

        </div>


        <!-- Reset form -->
        <form
            class="auth-form"
            id="resetPasswordForm"
            >

            <!-- New password -->
            <div class="auth-field">

                <label
                    class="auth-label"
                    for="password"
                    data-i18n="new_password_label"
                    >
                    New password
                </label>

                <div class="auth-input-wrapper">

                    <svg
                        class="auth-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        >
                        <rect
                            x="3"
                            y="11"
                            width="18"
                            height="11"
                            rx="2"
                            ry="2"
                        />

                        <path
                            d="M7 11V7a5 5 0 0110 0v4"
                        />
                    </svg>

                    <input
                        class="auth-input"
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        placeholder="Enter your new password"
                        >

                </div>

            </div>


            <!-- Confirm password -->
            <div class="auth-field">

                <label
                    class="auth-label"
                    for="confirmPassword"
                    data-i18n="confirm_new_password_label"
                    >
                    Confirm new password
                </label>

                <div class="auth-input-wrapper">

                    <svg
                        class="auth-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        >
                        <rect
                            x="3"
                            y="11"
                            width="18"
                            height="11"
                            rx="2"
                            ry="2"
                        />

                        <path
                            d="M7 11V7a5 5 0 0110 0v4"
                        />
                    </svg>

                    <input
                        class="auth-input"
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        placeholder="Enter the password again"
                        >

                </div>

            </div>


            <!-- Status message -->
            <p
                class="auth-message"
                id="message"
                role="alert"
                aria-live="polite"
            ></p>


            <!-- Submit -->
            <button
                class="auth-button"
                type="submit"
                data-i18n="reset_btn"
                >
                🔐 Update Password
            </button>

        </form>


        <div class="auth-stars">
            ⭐ ⭐ ⭐
        </div>


        <div class="auth-footer">
            <span data-i18n="remembered_password">Remembered your password?</span>
            <a href="login.html" data-i18n="back_to_login">
                Back to login
            </a>
        </div>

    </main>


    <script src="config.js"></script>
    <script src="password-toggle.js"></script>
    <script
        type="module"
        src="reset_password.js"
    ></script>
    <script src="i18n.js"></script>

</body>

</html>
