<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    StoryBond – Login
  </title>


  <!-- Google Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />


  <!-- Login Page CSS -->

  <link rel="stylesheet" href="login-style.css" />

</head>


<body>


  <!-- =========================================
       ANIMATED BACKGROUND
       ========================================= -->

  <div class="bg-canvas" aria-hidden="true">

    <div class="bubble bubble--1"></div>

    <div class="bubble bubble--2"></div>

    <div class="bubble bubble--3"></div>

    <div class="bubble bubble--4"></div>

    <div class="bubble bubble--5"></div>

  </div>


  <!-- =========================================
       FLOATING DECORATIONS
       ========================================= -->

  <span class="emoji-deco" aria-hidden="true">
    🌟
  </span>

  <span class="emoji-deco" aria-hidden="true">
    🎈
  </span>

  <span class="emoji-deco" aria-hidden="true">
    🦄
  </span>

  <span class="emoji-deco" aria-hidden="true">
    🍭
  </span>

  <span class="emoji-deco" aria-hidden="true">
    🎀
  </span>

  <span class="emoji-deco" aria-hidden="true">
    🌈
  </span>


  <!-- =========================================
       LOGIN CARD
       ========================================= -->

  <div class="card" role="main">


    <!-- =====================================
         LANGUAGE SWITCHER
         ===================================== -->

    <div class="lang-switcher-auth">

      <button class="lang-btn active" type="button">
        EN
      </button>

      <button class="lang-btn" type="button">
        TR
      </button>

    </div>


    <!-- =====================================
         HEADER
         ===================================== -->

    <div class="header">

      <span class="mascot" aria-hidden="true">
        🦊
      </span>


      <h1>

        <span class="brand-name">
          StoryBond
        </span>

      </h1>


      <p class="header__subtitle" data-i18n="login_subtitle">
        Log in to start your adventure 🚀
      </p>

    </div>


    <!-- =====================================
         SUCCESS MESSAGE
         ===================================== -->

    <div class="success-banner" id="successBanner" role="alert" aria-live="polite">
      🎉 Yay! You're in! Let's go! 🎊
    </div>


    <!-- =====================================
         PARENT LOGIN FORM
         ===================================== -->

    <form class="form" id="loginForm" novalidate>


      <!-- Email / Username -->

      <div class="field">

        <label class="field__label" for="email">

          <span></span>

          <span data-i18n="login_email_label">
            Your Email or Username
          </span>

        </label>


        <div class="field__input-wrap">

          <svg class="field__svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />

            <polyline points="22,6 12,13 2,6" />

          </svg>


          <input class="field__input" type="text" id="email" placeholder="e.g. coolkid123" autocomplete="username"
            aria-describedby="emailError" />

        </div>


        <span class="field__error" id="emailError" role="alert"></span>


        <div class="signup-prompt" id="signupPrompt" role="alert">

          <span data-i18n="signup_prompt_text">
            No account with that email yet.
          </span>

          <a class="signup-prompt__link" id="signupPromptLink" href="signup.html" data-i18n="signup_prompt_link">
            Create an account →
          </a>

        </div>

      </div>


      <!-- Password -->

      <div class="field">

        <label class="field__label" for="password">

          <span></span>

          <span data-i18n="password_label">
            Password
          </span>

        </label>


        <div class="field__input-wrap">

          <svg class="field__svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />

            <path d="M7 11V7a5 5 0 0110 0v4" />

          </svg>


          <input class="field__input" type="password" id="password" placeholder="password"
            autocomplete="current-password" aria-describedby="passwordError" />

        </div>


        <span class="field__error" id="passwordError" role="alert"></span>

      </div>


      <!-- Remember Me / Forgot Password -->

      <div class="extras">

        <label class="remember">

          <input type="checkbox" id="rememberMe" />

          <span data-i18n="remember_me">
            Remember me
          </span>

        </label>


        <a class="forgot-link" href="forgot_password.html" data-i18n="forgot_password_link">
          Forgot password?
        </a>

      </div>


      <!-- Parent Login Button -->

      <button class="btn-login" type="button" id="loginBtn">

        <span class="btn-login__text" data-i18n="login_btn">
          🚀 Let's Go!
        </span>

        <span class="btn-login__spinner" aria-hidden="true"></span>

      </button>


    </form>


    <!-- =====================================
         CLINICIAN ACCESS
         ===================================== -->

    <!-- Clinician Login -->

    <div class="clinician-login-section">

      <div class="clinician-login-divider">
        <span>Clinician access</span>
      </div>

      <button type="button" class="clinician-login-button" onclick="window.location.href='clinician-login.html'">
        🩺 Clinician Login
      </button>

    </div>

    <!-- =====================================
         FOOTER
         ===================================== -->

    <div class="stars-row" aria-hidden="true">
      ⭐ ⭐ ⭐
    </div>


    <div class="footer">

      <span data-i18n="login_footer_text">
        New here?
      </span>

      <a href="signup.html" data-i18n="login_footer_link">
        Create an account!
      </a>

    </div>


  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script src="login-script.js"></script>

  <script src="i18n.js"></script>


</body>

</html>
