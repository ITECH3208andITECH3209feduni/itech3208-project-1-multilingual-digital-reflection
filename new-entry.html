<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryBond - New Journal Entry</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Rainbow Magic Bar -->
    <div class="rainbow-top"></div>
    
    <div class="app-wrapper">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <!-- Brand -->
            <div class="brand">
                <div class="logo">🦊</div>
                <h1 class="brand-name">StoryBond</h1>
                <p class="brand-tagline">The Family Digital Journal</p>
            </div>

            <!-- Navigation -->
            <nav class="nav">
                <p class="nav-heading" data-i18n="nav_navigation">NAVIGATION</p>
                <a href="index.html" class="nav-link">
                    <span class="nav-emoji">🏠</span>
                    <span data-i18n="nav_home">Home</span>
                </a>
				<a href="new-entry.html" class="nav-link active">
                    <span class="nav-emoji">📖</span>
                    <span data-i18n="nav_journal">Journal</span>
                </a>
                <a href="weekly.html" class="nav-link">
                    <span class="nav-emoji">📊</span>
                    <span data-i18n="nav_weekly">Weekly Recap</span>
                </a>

            </nav>

            <!-- Children -->
            <div class="children">
                <p class="nav-heading" data-i18n="nav_children">CHILDREN</p>
                <div class="no-children" data-i18n="no_children">No children yet</div>
                <button class="add-child-btn" onclick="window.location.href='add-child.html'">
                    <span class="plus">+</span>
                    <span data-i18n="add_child">Add Child</span>
                </button>
            </div>

            <!-- User Profile -->
            <div class="user-card-wrapper">
                <div class="user-card" id="userCardTrigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
                    <div class="user-avatar">PA</div>
                    <div class="user-details">
                        <p class="user-name" data-i18n="user_name">Parent Account</p>
                        <p class="user-role" data-i18n="user_role">Parent</p>
                    </div>
                    <span class="user-card__chevron" aria-hidden="true">▾</span>
                </div>
                <div class="account-menu" id="accountMenu">
                    <button type="button" class="account-menu__item" id="switchAccountBtn">
                        <span class="account-menu__icon">🔄</span>
                        <span data-i18n="switch_account">Switch account</span>
                    </button>
                    <button type="button" class="account-menu__item account-menu__item--danger" id="logoutBtn">
                        <span class="account-menu__icon">🚪</span>
                        <span data-i18n="log_out">Log out</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div>
                    <h1 class="greeting">Hello,Parent!</h1>
                    <p class="date">Wednesday, April 22, 2026</p>
                </div>
                <div class="lang-switcher">
                    <button class="lang-btn active">EN</button>
                    <button class="lang-btn">TR</button>
                </div>
            </header>

            <!-- Journal Entry Form -->
            <div class="journal-entry-container">
                <h2 class="journal-heading" data-i18n="journal_heading">New journal entry</h2>
                <p class="journal-subheading" data-i18n="journal_subheading">Capture today's moments</p>

                <form class="journal-form" id="journalForm">
                    <!-- Entry Title and Date -->
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <input
                                type="text"
                                id="entryTitle"
                                placeholder="Entry title (e.g. Lena's big day)"
                                data-i18n-placeholder="entry_title_placeholder"
                                class="form-input"
                            />
                        </div>
                        <div class="form-group flex-1">
                            <input
                                type="text"
                                id="entryDate"
                                placeholder="Date: mm/dd/yyyy"
                                data-i18n-placeholder="entry_date_placeholder"
                                class="form-input"
                                maxlength="10"
                            />
                        </div>
                    </div>

                    <!-- Who is this entry about? -->
                    <div class="form-section">
                        <label class="section-label" data-i18n="who_about">WHO IS THIS ENTRY ABOUT?</label>
                        <div class="button-group">
                            <button type="button" class="tag-btn add-child-option" onclick="window.location.href='add-child.html'">
                                <span data-i18n="add_child_option">+ Add Child</span>
                            </button>
                        </div>
                    </div>

                    <!-- What happened? -->
                    <div class="form-section">
                        <label class="section-label" data-i18n="what_happened">WHAT HAPPENED?</label>
                        <textarea
                            id="storyText"
                            placeholder="Write your story here..."
                            data-i18n-placeholder="story_placeholder"
                            class="story-textarea"
                            rows="6"
                        ></textarea>
                    </div>

                    <!-- Mood -->
                    <div class="form-section">
                        <label class="section-label" data-i18n="mood_label">MOOD</label>
                        <div class="button-group">
                            <button type="button" class="mood-btn selected" data-mood="happy" data-i18n="mood_happy">
                                😊 Happy
                            </button>
                            <button type="button" class="mood-btn" data-mood="excited" data-i18n="mood_excited">
                                🤩 Excited
                            </button>
                            <button type="button" class="mood-btn" data-mood="loved" data-i18n="mood_loved">
                                🥰 Loved
                            </button>
                            <button type="button" class="mood-btn" data-mood="tired" data-i18n="mood_tired">
                                😴 Tired
                            </button>
                            <button type="button" class="mood-btn" data-mood="sad" data-i18n="mood_sad">
                                😢 Sad
                            </button>
                        </div>
                    </div>

                    <!-- Tags -->
                    <div class="form-section">
                        <label class="section-label" data-i18n="tags_label">TAGS</label>
                        <div class="button-group">
                            <button type="button" class="tag-btn" data-tag="milestone" data-i18n="tag_milestone"># Milestone</button>
                            <button type="button" class="tag-btn" data-tag="funny" data-i18n="tag_funny"># Funny</button>
                            <button type="button" class="tag-btn" data-tag="firsttime" data-i18n="tag_firsttime"># First Time</button>
                            <button type="button" class="tag-btn" data-tag="familytime" data-i18n="tag_familytime"># Family Time</button>
                            <button type="button" class="tag-btn add-tag-btn" data-i18n="add_tag">+ Add tag</button>
                        </div>
                    </div>

                    <!-- Add Photos / Videos -->
                    <div class="form-section">
                        <label class="section-label" data-i18n="add_photos_label">ADD PHOTOS / VIDEOS</label>
                        <div class="media-upload-grid-3">
                            <div class="media-upload-box" onclick="document.getElementById('photoInput').click()">
                                <span class="upload-icon">📷</span>
                                <span class="upload-label" data-i18n="photo_label">Photo</span>
                                <input type="file" id="photoInput" accept="image/*" multiple hidden>
                            </div>
                            <div class="media-upload-box" onclick="document.getElementById('videoInput').click()">
                                <span class="upload-icon">🎥</span>
                                <span class="upload-label" data-i18n="video_label">Video</span>
                                <input type="file" id="videoInput" accept="video/*" multiple hidden>
                            </div>
                            <div class="media-upload-box" onclick="handleAddMore()">
                                <span class="upload-icon">+</span>
                                <span class="upload-label" data-i18n="add_label">Add</span>
                            </div>
                        </div>
                        <div id="mediaPreview" class="media-preview-area"></div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="form-actions-journal">
                        <button type="button" class="cancel-btn-journal" onclick="window.location.href='index.html'" data-i18n="cancel_btn">
                            Cancel
                        </button>
                        <button type="submit" class="save-btn-journal">
                            <span>💾</span>
                            <span data-i18n="save_entry">Save Entry</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
<script src="journal-script.js"></script>

<script>
async function loadChildren() {
    const userId = localStorage.getItem('userId');
    if (!userId) {
        window.location.href = 'login.html';
        return;
    }
    
    try {
        const response = await fetch(`${API_URL}/api/children/parent/${userId}`);
        const data = await response.json();
        
        if (data.success && data.data.length > 0) {
            const childrenContainer = document.querySelector('.children');
            const addBtn = childrenContainer.querySelector('.add-child-btn');
            childrenContainer.innerHTML = '<p class="nav-heading">CHILDREN</p>';
            
            data.data.forEach(child => {
                const childEl = document.createElement('div');
                childEl.className = 'child-item';
                childEl.style.cssText = 'display:flex; align-items:center; gap:8px; padding:8px; cursor:pointer; border-radius:8px; margin:4px 0;';
                childEl.innerHTML = `
                    <span style="font-size:24px;">${child.avatar}</span>
                    <span style="font-size:14px; font-weight:500;">${child.name}</span>
                `;
                childEl.addEventListener('click', () => {
                    localStorage.setItem('selectedChildId', child.id);
                    localStorage.setItem('selectedChildName', child.name);
                    localStorage.setItem('selectedChildAvatar', child.avatar);
                    window.location.href = 'index.html';
                });
                childrenContainer.appendChild(childEl);
            });

            if (addBtn) childrenContainer.appendChild(addBtn);
            
            const userName = localStorage.getItem('userName');
            if (userName) {
                const greeting = document.querySelector('.greeting');
                if (greeting) greeting.textContent = `Hello, ${userName}! 👋`;
            }
        }
    } catch (error) {
        console.error('Error loading children:', error);
    }
}

function updateHeaderDate() {
    const dateEl = document.querySelector('.date');
    if (dateEl) {
        const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
        dateEl.textContent = new Date().toLocaleDateString('en-US', options);
    }
}

loadChildren();
updateHeaderDate();
</script>
    <script src="logout.js"></script>
    <script src="session.js"></script>
<script src="i18n.js"></script>
</body>
</html>
